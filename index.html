<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waste Recycling Platform</title>
<style>
body{font-family:Arial;background:#e8f5e9;margin:0;padding:15px}
h1{text-align:center;color:#2e7d32}
.card{background:#fff;padding:15px;border-radius:12px;margin-bottom:15px;box-shadow:0 2px 8px #0001}
input,select,button{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:1px solid #ccc;font-size:16px}
button{background:#2e7d32;color:#fff;border:none;font-weight:bold}
button:active{opacity:.8}
.item{background:#f1f8e9;padding:10px;border-radius:8px;margin:5px 0}
.points{font-size:22px;text-align:center;color:#2e7d32;font-weight:bold}
</style>
</head>
<body>
<h1>♻️ منصة إعادة تدوير المخلفات</h1>
<div class="card">
<div class="points">نقاطك: <span id="points">0</span> نقطة</div>
<p style="text-align:center">كل 1 كجم = 10 نقاط</p>
</div>
<div class="card">
<h3>إضافة مخلفات جديدة</h3>
<input id="name" placeholder="اسم المخلف - مثال: زجاجات بلاستيك">
<select id="type">
<option>بلاستيك</option><option>ورق</option><option>زجاج</option><option>معدن</option><option>عضوي</option>
</select>
<input id="weight" type="number" placeholder="الوزن بالكيلو">
<button onclick="addItem()">إضافة + احسب النقاط</button>
</div>
<div class="card">
<h3>المخلفات المضافة</h3>
<div id="list">لسه مفيش حاجة مضافة</div>
<p><b>إجمالي الوزن:</b> <span id="total">0</span> كجم</p>
</div>
<div class="card">
<h3>استبدال النقاط بمكافآت</h3>
<button onclick="redeem(50)">خصم 50 نقطة - كوبون خصم</button>
<button onclick="redeem(100)">خصم 100 نقطة - هدية</button>
<button onclick="redeem(200)">خصم 200 نقطة - جائزة كبيرة</button>
<p id="msg"></p>
</div>
<script>
let points=0,total=0,items=[];
function addItem(){
let n=document.getElementById('name').value;
let t=document.getElementById('type').value;
let w=parseFloat(document.getElementById('weight').value);
if(!n||!w){alert('اكتب الاسم والوزن');return;}
let p=w*10; points+=p; total+=w;
items.push(n+' | '+t+' | '+w+' كجم | +'+p+' نقطة');
document.getElementById('points').innerText=points;
document.getElementById('total').innerText=total;
document.getElementById('list').innerHTML=items.map(x=>'<div class="item">'+x+'</div>').join('');
document.getElementById('name').value='';document.getElementById('weight').value='';
}
function redeem(x){
if(points>=x){points-=x;document.getElementById('points').innerText=points;document.getElementById('msg').innerText='تم الاستبدال بنجاح! باقي معاك '+points+' نقطة';}
else{document.getElementById('msg').innerText='نقاطك مش كفاية، محتاج '+x+' نقطة';}
}
</script>
</body>
</html>
